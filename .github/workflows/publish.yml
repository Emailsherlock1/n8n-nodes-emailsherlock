name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # npm OIDC trusted publishing needs npm >= 11.5; node 20 bundles npm 10,
      # which skips the token exchange and publishes unauthenticated (E404).
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm publish --access public --provenance
